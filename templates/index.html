<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UL Boxing Club Sign-In</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --bg: #f3f6fb;
        --card: #fff;
        --accent: #0b63d6;
        --muted: #6b7280;
        --success: #16a34a;
        --danger: #dc2626;
        --glass: rgba(255, 255, 255, 0.6);
        --radius: 12px;
        --shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        --gap: 20px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: linear-gradient(180deg, #eef3fb 0%, var(--bg) 100%);
        color: #0f172a;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
        box-sizing: border-box;
      }
      .panel {
        width: 1100px;
        max-width: calc(100% - 48px);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--gap);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      /* LEFT: sign-in */
      .left {
        background: var(--card);
        padding: 34px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
        width: 100%;
        justify-content: center;
      }
      .brand img {
        height: 64px;
        width: auto;
        border-radius: 10px;
        object-fit: cover;
        box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
      }
      .brand h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: linear-gradient(
          180deg,
          rgba(11, 99, 214, 0.03),
          rgba(11, 99, 214, 0.01)
        );
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
        box-shadow: 0 6px 18px rgba(11, 63, 117, 0.04);
        text-align: center;
      }

      .label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
        text-align: left;
      }
      .input {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      input[type="text"] {
        flex: 1;
        padding: 14px 16px;
        border-radius: 10px;
        border: 1px solid #e6eef8;
        font-size: 16px;
        outline: none;
        transition: box-shadow 0.18s, border-color 0.12s, transform 0.08s;
        box-sizing: border-box;
        background: transparent;
      }
      input[type="text"]:focus {
        border-color: var(--accent);
        box-shadow: 0 6px 18px rgba(11, 99, 214, 0.08);
        transform: translateY(-1px);
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        margin-top: 8px;
      }
      .message {
        min-height: 42px;
        margin-top: 12px;
        font-weight: 700;
        transition: all 0.18s;
        border-radius: 8px;
        padding: 10px 12px;
        box-sizing: border-box;
      }
      .message.ok {
        color: var(--success);
        background: rgba(22, 163, 74, 0.06);
        border: 1px solid rgba(22, 163, 74, 0.08);
      }
      .message.err {
        color: var(--danger);
        background: rgba(220, 38, 38, 0.04);
        border: 1px solid rgba(220, 38, 38, 0.06);
      }
      .message.warn {
        color: #d97706;
        background: rgba(251, 191, 36, 0.08);
        border: 1px solid rgba(251, 191, 36, 0.16);
      }
      .message.hide {
        display: none;
      }

      /* RIGHT: QR + info */
      .right {
        background: linear-gradient(180deg, #07102a 0%, #0b1220 100%);
        color: #fff;
        padding: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .right h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.02;
      }
      .right p {
        margin: 0;
        color: #cbd5e1;
        text-align: center;
      }
      .qr-wrap {
        margin-top: 8px;
        background: var(--glass);
        padding: 18px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .qr-wrap img {
        max-width: 420px;
        width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
      }

      .stats {
        display: flex;
        gap: 14px;
        margin-top: 12px;
      }
      .stat {
        background: rgba(255, 255, 255, 0.06);
        padding: 10px 14px;
        border-radius: 10px;
        text-align: center;
        min-width: 120px;
      }
      .stat b {
        display: block;
        font-size: 18px;
      }
      .stat span {
        font-size: 12px;
        color: #cbd5e1;
      }

      footer.global {
        margin-top: 18px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
        text-align: center;
        width: 100%;
      }
      footer.mini {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        width: 100%;
      }

      /* responsive */
      @media (max-width: 900px) {
        .panel {
          grid-template-columns: 1fr;
        }
        .right {
          order: 2;
          padding-top: 20px;
          padding-bottom: 40px;
        }
        .left {
          order: 1;
        }
        .brand {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main class="panel" role="main" aria-label="UL Boxing Club Sign-In">
        <!-- LEFT -->
        <section class="left" aria-labelledby="signinHeading">
          <img
            src="{{ url_for('static', filename='images/logo.jpg') }}"
            alt="UL Boxing Club logo"
            width="200"
          />
          <div class="brand" style="width: 100%">
            <h2 id="signinHeading">UL Boxing Club — Sign In</h2>
          </div>

          <div class="card" aria-live="polite">
            <label class="label" for="studentNumber">Student ID</label>
            <div class="input">
              <input
                id="studentNumber"
                name="studentNumber"
                type="text"
                placeholder="Enter student ID and press Enter"
                autocomplete="off"
                inputmode="numeric"
                pattern="\d*"
                aria-label="Student number"
              />
            </div>

            <div id="message" class="message hide" aria-live="assertive"></div>
          </div>

          <div
            style="
              margin-top: 12px;
              color: var(--muted);
              font-size: 13px;
              text-align: center;
            "
          >
            &copy; <strong>2025 UL Boxing Club</strong> — Last updated:
            20/09/2025
          </div>

          <!-- admin moved to footer to avoid accidental clicks -->
          <div
            class="mini-footer"
            style="width: 100%; text-align: center; margin-top: 6px"
          >
            <a
              href="#"
              onclick="adminPrompt(event)"
              style="color: blue; font-size: 12px; text-decoration: underline"
              >Admin (secured)</a
            >
          </div>
        </section>

        <!-- RIGHT -->
        <aside class="right" aria-labelledby="joinHeading">
          <h1 id="joinHeading">Not a member yet?</h1>
          <p>
            Scan the QR code below to join the club and complete your
            registration on the UL Wolves Wesite.
          </p>

          <div class="qr-wrap" role="img" aria-label="Join membership QR code">
            <img
              src="{{ url_for('static', filename='images/join_membershipqrcode.jpeg') }}"
              alt="Join Membership QR"
            />
          </div>

          <div class="stats" aria-hidden="false">
            <div class="stat">
              <b>{{ approved_count }}</b><span>Members approved</span>
            </div>
            <div class="stat">
              <b>{{ requested_count }}</b><span>Members pending</span>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script>
      const input = document.getElementById("studentNumber");
      const msgEl = document.getElementById("message");
      const SUCCESS_DISPLAY_MS = 2000;

      // focus and select on load
      window.addEventListener("load", () => {
        input.focus();
        input.select();
      });

      // helper for messages
      function clearMsg() {
        msgEl.className = "message hide";
        msgEl.textContent = "";
      }

      function showMsg(text, type = "muted", autoClear = false) {
        msgEl.className =
          "message " +
          (type === "ok"
            ? "ok"
            : type === "err"
            ? "err"
            : type === "warn"
            ? "warn"
            : "");
        msgEl.textContent = text;
        if (type === "ok" && autoClear) {
          setTimeout(() => {
            clearMsg();
          }, SUCCESS_DISPLAY_MS);
        }
      }

      async function signIn() {
        const number = input.value.trim();
        if (!number) {
          showMsg("Please enter a student ID", "err");
          input.focus();
          return;
        }

        showMsg("Checking...", "muted");

        try {
          const res = await fetch("/signin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ student_number: number }),
          });

          // handle non-json or network issues gracefully
          let data;
          try {
            data = await res.json();
          } catch (e) {
            showMsg("Server error", "err");
            input.value = "";
            input.focus();
            return;
          }

          if (data.status === "ok") {
            showMsg(data.message, "ok", true);
          } else if (data.status === "warn") {
            showMsg(data.message, "warn");
          } else {
            showMsg(data.message || "Error", "err");
          }
        } catch (err) {
          showMsg("Network error. Try again.", "err");
        }

        input.value = "";
        input.focus();
      }

      // Submit on Enter only
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          signIn();
        }
      });

      // move admin out of main UI click area
      function adminPrompt(e) {
        e.preventDefault();
        const code = prompt("Enter admin code:");
        if (code === "5103") {
          window.location.href = "/admin";
        } else if (code) {
          alert("Incorrect code.");
        }
      }

      // clear any existing message after 6s if it's an error to keep UI tidy
      let errorClearTimer = null;
      const observer = new MutationObserver(() => {
        if (
          msgEl.classList.contains("err") ||
          msgEl.classList.contains("warn")
        ) {
          if (errorClearTimer) clearTimeout(errorClearTimer);
          errorClearTimer = setTimeout(() => {
            clearMsg();
          }, 5000);
        }
      });
      observer.observe(msgEl, { attributes: true, attributeFilter: ["class"] });
    </script>
  </body>
</html>
